services:
  # Dedicated Frontend Service (accessible at http://localhost:3000)
  frontend:
    image: nginx:alpine
    container_name: emergency_response_frontend
    ports:
      - "3000:80"
    volumes:
      - ./client:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  # Backend FastAPI Service (accessible at http://localhost:8000)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emergency_response_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/app/backend/app/emergency_response.db
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app/backend
      - ./client:/app/client
    restart: unless-stopped

  # Optional production PostgreSQL with PostGIS extension for spatial queries
  db:
    image: postgis/postgis:16-3.4
    container_name: emergency_response_postgis
    environment:
      POSTGRES_DB: emergency_response_db
      POSTGRES_USER: emergency_admin
      POSTGRES_PASSWORD: emergency_secure_password
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgis_data:
